name: verify

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22.19.0
            harness: 0.1.2-rc.1
          - node: 24.x
            harness: 0.1.2-rc.1
          - node: 24.x
            harness: 0.1.1-rc.2
          - node: 24.x
            harness: 0.1.5-alpha.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Select exact alternative Harness graph
        if: matrix.harness != '0.1.2-rc.1'
        env:
          HARNESS_VERSION: ${{ matrix.harness }}
        run: node scripts/select-harness-version.mjs --harness-version "$HARNESS_VERSION"

      - name: Verify
        run: npm run verify

      - name: Verify packed install with current DeepSeek Harness components
        if: matrix.node == '24.x'
        run: npm run verify:dsh-install -- --harness-version '${{ matrix.harness }}'

      - name: Verify fresh DeepSeek Harness profile
        if: matrix.node == '24.x'
        run: npm run verify:dsh-profile -- --harness-version '${{ matrix.harness }}' --output registry-profile-receipt.json

      - name: Retain exact-version profile receipt
        if: matrix.node == '24.x'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registry-profile-${{ matrix.harness }}
          path: registry-profile-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Reproduce benchmark
        run: npm run bench -- --output benchmark.json

      - name: Production audit
        run: npm audit --omit=dev

      - name: Pack dry run
        run: npm pack --dry-run --json --ignore-scripts

  verify-windows-profile:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Verify packed install with current DeepSeek Harness components
        run: npm run verify:dsh-install

      - name: Verify fresh DeepSeek Harness profile
        run: npm run verify:dsh-profile

  verify-desktop-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout MCP Lens
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x

      - name: Checkout pinned DSH Desktop source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anywhere-labs/dsh-desktop
          ref: d29bf7a965fc68bf09750bc329905ecb17afe48b
          path: .desktop-alpha-source
          persist-credentials: false

      - name: Verify DSH Desktop alpha compatibility
        run: npm run verify:dsh-desktop-alpha -- --desktop-source .desktop-alpha-source --output desktop-alpha-receipt.json

      - name: Retain Desktop alpha compatibility receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-alpha-compatibility-receipt
          path: desktop-alpha-receipt.json
          if-no-files-found: error
          retention-days: 30
