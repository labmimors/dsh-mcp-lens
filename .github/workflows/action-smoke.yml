name: action-smoke

on:
  pull_request:
    paths:
      - action.yml
      - action/**
      - site/share-metrics.js
      - .github/workflows/action-smoke.yml
  push:
    branches:
      - main
    paths:
      - action.yml
      - action/**
      - site/share-metrics.js
      - .github/workflows/action-smoke.yml

permissions:
  contents: read

jobs:
  local-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create a model-facing tool fixture
        run: >-
          node -e "require('node:fs').writeFileSync('.action-smoke-tools.json',
          JSON.stringify([{name:'alpha',inputSchema:{type:'object'}},
          {name:'beta',inputSchema:{type:'object'}}]))"
      - id: audit
        uses: ./
        with:
          tools-file: .action-smoke-tools.json
          max-tools: 2
          max-schema-bytes: 1024
      - name: Verify numeric outputs
        env:
          TOOL_COUNT: ${{ steps.audit.outputs.tool-count }}
          LENS_TOOL_COUNT: ${{ steps.audit.outputs.lens-tool-count }}
          SCHEMA_BYTES: ${{ steps.audit.outputs.schema-bytes }}
          SHARE_URL: ${{ steps.audit.outputs.share-url }}
          SHARE_MARKDOWN: ${{ steps.audit.outputs.share-markdown }}
        run: |
          test "$TOOL_COUNT" = "2"
          test "$LENS_TOOL_COUNT" = "2"
          case "$SCHEMA_BYTES" in
            ''|*[!0-9]*) exit 1 ;;
          esac
          case "$SHARE_URL" in
            https://labmimors.github.io/dsh-mcp-lens/#v=1\&tools=2\&bytes=*\&check=*) ;;
            *) exit 1 ;;
          esac
          case "$SHARE_MARKDOWN" in
            *"Self-reported local measurement:"*"$SHARE_URL"*) ;;
            *) exit 1 ;;
          esac
