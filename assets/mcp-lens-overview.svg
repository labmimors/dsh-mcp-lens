<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">MCP Lens: 1,000 MCP tools through two interfaces</title>
  <desc id="desc">MCP Lens exposes mcp_search and mcp_call, revealing exact tool schemas on demand. In a synthetic 1,000-tool MCP component fixture, standing MCP tool-definition JSON is 647,962 bytes with the official direct client and 1,114 bytes with Lens.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111F"/>
      <stop offset="1" stop-color="#131A30"/>
    </linearGradient>
    <linearGradient id="lens-border" x1="580" y1="176" x2="1152" y2="357" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9F98EE" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#4EDAD5" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#6661BE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6661BE" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="canvas"><rect width="1200" height="440" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#canvas)" aria-hidden="true">
    <rect width="1200" height="440" fill="url(#background)"/>
    <ellipse cx="1080" cy="72" rx="380" ry="250" fill="url(#glow)"/>
    <path d="M48 382H1152" stroke="#27344A"/>
    <rect x="48" y="176" width="424" height="181" rx="18" fill="#111E31" stroke="#2B3B53"/>
    <rect x="580" y="176" width="572" height="181" rx="18" fill="#14213A" stroke="url(#lens-border)"/>
    <path d="M493 265H557M549 257L557 265L549 273" fill="none" stroke="#76D9DF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="314" y="225" width="16" height="14" rx="3" fill="#34445C"/>
      <rect x="338" y="225" width="16" height="14" rx="3" fill="#43536B"/>
      <rect x="362" y="225" width="16" height="14" rx="3" fill="#4D557A"/>
      <rect x="386" y="225" width="16" height="14" rx="3" fill="#34445C"/>
      <rect x="410" y="225" width="16" height="14" rx="3" fill="#43536B"/>
      <rect x="314" y="249" width="16" height="14" rx="3" fill="#43536B"/>
      <rect x="338" y="249" width="16" height="14" rx="3" fill="#4D557A"/>
      <rect x="362" y="249" width="16" height="14" rx="3" fill="#34445C"/>
      <rect x="386" y="249" width="16" height="14" rx="3" fill="#43536B"/>
      <rect x="410" y="249" width="16" height="14" rx="3" fill="#4D557A"/>
      <rect x="314" y="273" width="16" height="14" rx="3" fill="#4D557A"/>
      <rect x="338" y="273" width="16" height="14" rx="3" fill="#34445C"/>
      <rect x="362" y="273" width="16" height="14" rx="3" fill="#43536B"/>
      <rect x="386" y="273" width="16" height="14" rx="3" fill="#4D557A"/>
      <rect x="410" y="273" width="16" height="14" rx="3" fill="#34445C"/>
    <rect x="604" y="221" width="156" height="38" rx="10" fill="#173C46" stroke="#347A82"/>
    <rect x="772" y="221" width="148" height="38" rx="10" fill="#302F53" stroke="#68629C"/>
    <rect x="997" y="218" width="130" height="86" rx="11" fill="#101A2C" stroke="#394762"/>
    <path d="M1013 259H1082M1013 272H1109M1013 285H1062" fill="none" stroke="#526987" stroke-width="3" stroke-linecap="round"/>
    <circle cx="1110" cy="236" r="3" fill="#7AE2D9"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="48" y="43" fill="#B9BAED" font-size="12" font-weight="600" letter-spacing="1.9">MCP LENS / DEEPSEEK HARNESS</text>
    <text x="48" y="95" fill="#F2F6FC" font-size="40" font-weight="700" letter-spacing="-0.8">1,000 MCP tools. Two interfaces.</text>
    <text x="48" y="132" fill="#A8B9CE" font-size="17">Search the catalog. Reveal the exact schema. Call the tool.</text>

    <text x="72" y="204" fill="#A1B1C7" font-size="12" font-weight="600" letter-spacing="1">OFFICIAL DIRECT CLIENT</text>
    <text x="72" y="251" fill="#E3EAF5" font-size="28" font-weight="600">1,000 tools</text>
    <text x="72" y="307" fill="#9CACBF" font-size="13">Standing MCP definition JSON</text>
    <text x="72" y="336" fill="#D4DEED" font-size="27" font-weight="600">647,962 B</text>

    <text x="604" y="204" fill="#91E1DD" font-size="12" font-weight="700" letter-spacing="1.5">MCP LENS</text>
    <text x="682" y="246" text-anchor="middle" fill="#B9F4EE" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="16">mcp_search</text>
    <text x="846" y="246" text-anchor="middle" fill="#DDD5FF" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="16">mcp_call</text>
    <text x="604" y="284" fill="#B6C4D7" font-size="15">Exact schemas, revealed on demand</text>
    <text x="1013" y="240" fill="#AAAED3" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="12">schema</text>
    <text x="604" y="307" fill="#9CACBF" font-size="13">Standing MCP definition JSON</text>
    <text x="604" y="336" fill="#8EF0E6" font-size="27" font-weight="700">1,114 B</text>

    <text x="48" y="411" fill="#8F9FB6" font-size="12">Component benchmark · synthetic 1,000-tool MCP fixture · standing tool-definition JSON</text>
  </g>
</svg>
