# Configure MCP servers and allowed tools in your profile's cordis.patch.yml.
- insert:
    - id: mcp-lens
      name: dsh-mcp-lens
      config:
        servers: []
        cachePath: !!js dshHomePath('mcp-lens/catalog.json')
        catalogTtlMs: 86400000
        idleDisconnectMs: 300000
        connectTimeoutMs: 30000
        callTimeoutMs: 60000
        discoveryTimeoutMs: 30000
        maxDiscoveryPages: 1000
        maxToolsPerServer: 10000
        maxBytesPerTool: 1048576
        maxTotalCatalogBytes: 67108864
        maxHttpResponseBytes: 16777216
        maxCursorBytes: 4096
        searchLimitDefault: 5
        searchLimitMax: 10
        # Match server/tool names; denyTools takes priority.
        allowTools: []
        denyTools: []
