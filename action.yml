name: MCP Lens Schema Audit
description: Measure the model-facing MCP schema surface without uploading tool definitions.
author: dsh-mcp-lens contributors

branding:
  icon: activity
  color: green

inputs:
  tools-file:
    description: Workspace-relative path to a JSON tool array, tools/schemas object, or recorded request.header.tools payload.
    required: true
  max-tools:
    description: Optional positive tool-count budget. The action fails when the payload exceeds it.
    required: false
  max-schema-bytes:
    description: Optional positive UTF-8 schema-byte budget. The action fails when the canonical payload exceeds it.
    required: false

outputs:
  tool-count:
    description: Number of tools in the supplied payload.
  schema-bytes:
    description: UTF-8 bytes in canonical JSON.stringify(tools) form.
  lens-tool-count:
    description: Fixed MCP Lens benchmark surface tool count (2).
  lens-schema-bytes:
    description: Fixed MCP Lens benchmark surface schema bytes (1114).
  schema-byte-reduction-percent:
    description: Schema-byte reduction versus the supplied payload, clamped to zero and rounded to three decimals.

runs:
  using: node24
  main: action/index.js
